<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beating Canvas Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #000;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heart"></canvas>

    <script>
        (function () {
            // Detect mobile devices for performance scaling
            var isDevice = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(
                (navigator.userAgent || navigator.vendor || window.opera).toLowerCase()
            );

            var loaded = false;

            var init = function () {
                if (loaded) return;
                loaded = true;

                var mobile = isDevice;
                var koef = mobile ? 0.5 : 1;
                var canvas = document.getElementById("heart");
                if (!canvas) return;

                var ctx = canvas.getContext("2d");

                // Get dimensions with fallback checks if innerWidth/innerHeight are 0 initially
                function getWidth() {
                    return (window.innerWidth || document.documentElement.clientWidth || 300) * koef;
                }
                function getHeight() {
                    return (window.innerHeight || document.documentElement.clientHeight || 150) * koef;
                }

                var width = (canvas.width = getWidth());
                var height = (canvas.height = getHeight());
                var rand = Math.random;

                // Set initial dark background fill
                ctx.fillStyle = "rgba(0,0,0,1)";
                ctx.fillRect(0, 0, width, height);

                var heartPosition = function (rad) {
                    return [
                        Math.pow(Math.sin(rad), 3),
                        -(
                            15 * Math.cos(rad) -
                            5 * Math.cos(2 * rad) -
                            2 * Math.cos(3 * rad) -
                            Math.cos(4 * rad)
                        )
                    ];
                };

                var scaleAndTranslate = function (pos, sx, sy, dx, dy) {
                    return [dx + pos[0] * sx, dy + pos[1] * sy];
                };

                window.addEventListener("resize", function () {
                    width = canvas.width = getWidth();
                    height = canvas.height = getHeight();
                    ctx.fillStyle = "rgba(0,0,0,1)";
                    ctx.fillRect(0, 0, width, height);
                });

                var traceCount = mobile ? 20 : 50;
                var pointsOrigin = [];
                var i;
                var dr = mobile ? 0.3 : 0.1;

                // Scale heart shape layers
                for (i = 0; i < Math.PI * 2; i += dr)
                    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
                for (i = 0; i < Math.PI * 2; i += dr)
                    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
                for (i = 0; i < Math.PI * 2; i += dr)
                    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));

                var heartPointsCount = pointsOrigin.length;
                var targetPoints = [];

                var pulse = function (kx, ky) {
                    for (i = 0; i < pointsOrigin.length; i++) {
                        targetPoints[i] = [];
                        targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
                        targetPoints[i][1] = ky * pointsOrigin[i][1] + height / 2;
                    }
                };

                var particles = [];
                for (i = 0; i < heartPointsCount; i++) {
                    var x = rand() * width;
                    var y = rand() * height;
                    particles[i] = {
                        vx: 0,
                        vy: 0,
                        R: 2,
                        speed: rand() + 5,
                        q: ~~(rand() * heartPointsCount),
                        D: 2 * (i % 2) - 1,
                        force: 0.2 * rand() + 0.7,
                        f:
                            "hsla(0," +
                            ~~(40 * rand() + 60) +
                            "%," +
                            ~~(60 * rand() + 20) +
                            "%,.3)",
                        trace: []
                    };
                    for (var k = 0; k < traceCount; k++) particles[i].trace[k] = { x: x, y: y };
                }

                var config = {
                    traceK: 0.4,
                    timeDelta: 0.01
                };

                var time = 0;

                var loop = function () {
                    var n = -Math.cos(time);
                    pulse((1 + n) * 0.5, (1 + n) * 0.5);
                    time += (Math.sin(time) < 0 ? 9 : n > 0.8 ? 0.2 : 1) * config.timeDelta;

                    // Semi-transparent overlay to create particle trail effects
                    ctx.fillStyle = "rgba(0,0,0,.1)";
                    ctx.fillRect(0, 0, width, height);

                    for (i = particles.length; i--; ) {
                        var u = particles[i];
                        var q = targetPoints[u.q];
                        if (!q) continue;

                        var dx = u.trace[0].x - q[0];
                        var dy = u.trace[0].y - q[1];
                        var length = Math.sqrt(dx * dx + dy * dy);

                        if (10 > length) {
                            if (0.95 < rand()) {
                                u.q = ~~(rand() * heartPointsCount);
                            } else {
                                if (0.99 < rand()) {
                                    u.D *= -1;
                                }
                                u.q += u.D;
                                u.q %= heartPointsCount;
                                if (0 > u.q) {
                                    u.q += heartPointsCount;
                                }
                            }
                        }

                        u.vx += (-dx / (length || 1)) * u.speed;
                        u.vy += (-dy / (length || 1)) * u.speed;
                        u.trace[0].x += u.vx;
                        u.trace[0].y += u.vy;
                        u.vx *= u.force;
                        u.vy *= u.force;

                        for (k = 0; k < u.trace.length - 1; ) {
                            var T = u.trace[k];
                            var N = u.trace[++k];
                            N.x -= config.traceK * (N.x - T.x);
                            N.y -= config.traceK * (N.y - T.y);
                        }

                        ctx.fillStyle = u.f;
                        for (k = 0; k < u.trace.length; k++) {
                            ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
                        }
                    }

                    window.requestAnimationFrame(loop);
                };

                loop();
            };

            var s = document.readyState;
            if (s === "complete" || s === "loaded" || s === "interactive") {
                init();
            } else {
                document.addEventListener("DOMContentLoaded", init, false);
            }
            window.addEventListener("load", init, false);
        })();
    </script>
</body>
</html>
